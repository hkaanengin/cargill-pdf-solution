<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGM Tescil Stamper</title>
  <style>
    :root { --accent: #b00020; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f4f5f7; color: #1c1c1e; margin: 0;
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
    }
    .card {
      background: #fff; border-radius: 14px; padding: 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08); width: 100%; max-width: 460px;
    }
    .steps { display: flex; gap: 8px; margin-bottom: 20px; font-size: .78rem; }
    .steps span {
      flex: 1; text-align: center; padding: 6px 4px; border-radius: 8px;
      background: #eee; color: #999;
    }
    .steps span.active { background: var(--accent); color: #fff; }
    .steps span.done { background: #e7f6ec; color: #1a7f3c; }
    h1 { font-size: 1.35rem; margin: 0 0 6px; }
    p.sub { margin: 0 0 24px; color: #666; font-size: .92rem; line-height: 1.5; }
    .drop {
      border: 2px dashed #cfd2d6; border-radius: 12px; padding: 28px 16px;
      text-align: center; cursor: pointer; transition: .15s; margin-bottom: 18px;
    }
    .drop:hover, .drop.drag { border-color: var(--accent); background: #fff7f8; }
    .drop input { display: none; }
    .drop .icon { font-size: 2rem; }
    .drop .name { margin-top: 8px; font-weight: 600; color: var(--accent); word-break: break-all; }
    button {
      width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: var(--accent); color: #fff; font-size: 1rem; font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .flash { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; font-size: .9rem; }
    .flash.error { background: #fdecef; color: #8a0018; border: 1px solid #f3c2cd; }
    .flash.ok { background: #e7f6ec; color: #1a7f3c; border: 1px solid #b7e3c4; }
    .flash.warn { background: #fff6e5; color: #8a5300; border: 1px solid #f2ddb0; }
    .hint { margin-top: 18px; font-size: .8rem; color: #888; line-height: 1.5; }
    .source { font-size: .85rem; color: #444; margin-bottom: 18px;
      background: #f7f7f9; border: 1px solid #eee; border-radius: 8px; padding: 10px 12px; }
    .source b { color: var(--accent); }
    .ready { font-size: .85rem; color: #1a7f3c; margin-bottom: 18px;
      background: #e7f6ec; border: 1px solid #b7e3c4; border-radius: 8px; padding: 10px 12px; }
    .ready b { word-break: break-all; }
    .ready a.link { color: #1a7f3c; margin-left: 6px; }
    a.link { color: var(--accent); text-decoration: none; font-size: .85rem; }
    a.link:hover { text-decoration: underline; }
    code { background: #eee; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="steps">
      <span class="{{ 'active' if step == 1 else 'done' }}">1 · Excel source</span>
      <span class="{{ 'active' if step == 2 else '' }}">2 · SGM PDFs</span>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="flash {{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
  {% block script %}{% endblock %}
</body>
</html>
